ekf_local_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true # Set to false if you are flying/moving in 3D
    publish_tf: true
    predict_to_current_time: false


    map_frame: map
    odom_frame: odom
    base_link_frame: base_link  # Matching your static TF child frames
    world_frame: odom     # world_frame = odom makes this the local filter

    odom0: /uart/odometry  
    odom0_config: [false,  false,  false, # x, y, z
                   false, false, true,  # roll, pitch, yaw
                   true,  true,  false, # vx, vy, vz
                   false, false, false,  # vroll, vpitch, vyaw
